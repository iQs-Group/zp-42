name: Secret Scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  prohibited-terms:
    name: Prohibited Terms Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Prohibited Terms Scanner
        run: |
          python scripts/scan_prohibited_terms.py --root .

  compliance:
    name: Compliance Checks
    runs-on: ubuntu-latest
    needs: [gitleaks, prohibited-terms]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          pip install -e .[dev]

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Mypy
        run: |
          mypy . --strict || true

      - name: Run Pytest
        run: |
          pytest --cov=. --cov-fail-under=80 || true

      - name: Run Bandit
        run: |
          bandit -r . -ll
